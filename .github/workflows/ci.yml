name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  offline-tests:
    name: 离线单元测试 (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Windows runner 默认代码页不是 UTF-8，日志里的中文会触发编码错误
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # 只安装离线测试所需的轻量依赖，避免下载 torch / sentence-transformers
      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: 运行离线单元测试
        run: python -m pytest tests
